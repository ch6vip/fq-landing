name: Sync Latest Release

on:
  schedule:
    # 每 6 小时检查一次主仓库最新正式版（避开整点队列高峰）
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [app-release]

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest release into index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Commit and push if updated
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date."
            exit 0
          fi

          VERSION=$(node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script[^>]*id="app-schema"[^>]*>([\s\S]*?)<\/script>/);
            const schema = JSON.parse(m[1]);
            process.stdout.write("v" + schema.softwareVersion);
          ')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: 同步正式版 ${VERSION}"
          git push
